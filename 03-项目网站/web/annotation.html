<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人工标注库 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body data-page="annotation">
    <header class="subhero annotation-hero">
      <nav class="nav" aria-label="主导航">
        <div class="brand">高邮二王知识库</div>
        <div class="nav-links">
          <a href="./index.html">专题首页</a>
          <div class="database-menu">
            <a class="database-trigger" href="./database.html?view=terms" aria-haspopup="true">数据库</a>
            <div class="database-panel" aria-label="选择数据库">
              <a href="./database.html?view=terms"><span>主数据库</span><small>词条、案例与证据</small></a>
              <a href="./annotation.html"><span>人工标注库</span><small>人工标注材料浏览</small></a>
              <a href="./v2-database.html#browse"><span>V2 工作库</span><small>案例、五步与质量</small></a>
            </div>
          </div>
          <a href="./annotation-workbench.html">五步释证</a>
          <a href="./knowledge.html">训诂知识</a>
        </div>
      </nav>

      <div class="hero-content">
        <p class="badge">数据库 · 人工标注库</p>
        <h1>人工标注库</h1>
        <div id="annotationHeroMeta" class="hero-panel"></div>
      </div>
    </header>

    <main class="section annotation-page">
      <p id="annotationStatus" class="db-status">正在读取人工标注库...</p>

      <section class="card browser-toolbar annotation-toolbar">
        <div class="head-line annotation-toolbar-heading">
          <div>
            <p class="section-kicker">案例浏览</p>
            <h2>人工标注库</h2>
          </div>
          <span class="summary-pill">按标注者和出处筛选</span>
        </div>
        <p class="compact-note">关键词可以检索案例、方法、原文和标注内容；下面两个筛选只改变案例范围，不会改变原始标注结构。</p>

        <div class="annotation-filter-grid">
          <label class="toolbar-field annotation-query-field">
            <span>检索</span>
            <input id="annotationSearchInput" type="search" placeholder="案例、方法、原文或标注关键词" />
          </label>
          <label class="toolbar-field">
            <span>标注者</span>
            <select id="annotationAnnotatorFilter">
              <option value="all">全部标注者</option>
            </select>
          </label>
          <label class="toolbar-field">
            <span>出处</span>
            <select id="annotationOriginFilter">
              <option value="all">全部出处</option>
            </select>
          </label>
          <div class="annotation-filter-actions">
            <button id="annotationSearchButton" class="page-link toolbar-button" type="button">检索</button>
            <button id="annotationResetButton" class="search-clear toolbar-button" type="button">重置</button>
          </div>
        </div>

        <div class="annotation-preset-row">
          <span class="section-kicker">快捷检索</span>
          <div id="annotationPresets" class="browser-preset-list">
            <button class="preset-chip" type="button" data-annotation-query="平原之隰">平原之隰</button>
            <button class="preset-chip" type="button" data-annotation-query="误字">误字</button>
            <button class="preset-chip" type="button" data-annotation-query="集韻">集韻</button>
            <button class="preset-chip" type="button" data-annotation-query="发疑">发疑</button>
          </div>
        </div>
      </section>

      <div id="annotationSummary" class="search-summary"></div>
      <div id="annotationList" class="annotation-list"></div>
    </main>

    <footer class="footer">
      <p>人工标注灰度库 · 与主数据库并行</p>
    </footer>

    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/browser-common.js"></script>
    <script src="./assets/js/annotation.js?v=annotation-filters-v1"></script>
  </body>
</html>
