<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人工标注库 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="./assets/css/styles.css?v=annotation-search-v5" />
  </head>
  <body data-page="annotation">
    <header class="subhero annotation-hero">
      <nav class="nav" aria-label="主导航">
        <div class="brand">高邮二王知识库</div>
        <div class="nav-links">
          <a href="./index.html">专题首页</a>
          <div class="database-menu">
            <a class="database-trigger" href="./database.html?view=terms" aria-haspopup="true">数据库</a>
            <div class="database-panel" aria-label="选择数据库">
              <a href="./database.html?view=terms"><span>主数据库</span><small>词条、案例与证据</small></a>
              <a href="./annotation.html"><span>人工标注库</span><small>人工标注材料浏览</small></a>
              <a href="./v2-database.html#browse"><span>V2 工作库</span><small>案例、五步与质量</small></a>
            </div>
          </div>
          <a href="./annotation-workbench.html">五步释证</a>
          <a href="./knowledge.html">训诂知识</a>
        </div>
      </nav>

      <div class="hero-content">
        <p class="badge">数据库 · 人工标注库</p>
        <h1>人工标注库</h1>
        <div id="annotationHeroMeta" class="hero-panel"></div>
      </div>
    </header>

    <main class="section annotation-page">
      <p id="annotationStatus" class="db-status">正在读取人工标注库...</p>

      <div class="browser-layout annotation-browser-layout">
        <aside class="browser-sidebar annotation-sidebar">
          <article class="card sidebar-card annotation-filter-card">
            <div class="annotation-filter-heading">
              <h3>筛选</h3>
              <span id="annotationFilterSummary" class="compact-note">未筛选</span>
            </div>
            <section class="annotation-filter-section">
              <h4>出处</h4>
              <div id="annotationOriginFilters" class="annotation-filter-list"></div>
            </section>
            <section class="annotation-filter-section">
              <h4>标注者</h4>
              <div id="annotationAnnotatorFilters" class="annotation-filter-list"></div>
            </section>
          </article>
        </aside>

        <section class="browser-main">
          <section class="card browser-toolbar annotation-toolbar">
            <div class="head-line annotation-toolbar-heading">
              <div>
                <p class="section-kicker">案例浏览</p>
                <h2>人工标注库</h2>
              </div>
            </div>
            <div class="annotation-search-row">
              <label class="toolbar-field annotation-search-field">
                <span>关键词</span>
                <input id="annotationSearchInput" type="search" placeholder="检索案例、原文或证据（支持简繁）" />
              </label>
              <div class="toolbar-actions annotation-search-actions">
                <button id="annotationSearchButton" class="page-link toolbar-button" type="button">检索</button>
              </div>
            </div>
            <div id="annotationQuickSearches" class="annotation-quick-searches" aria-label="快捷检索"></div>
          </section>

          <div id="annotationSummary" class="search-summary"></div>
          <div id="annotationList" class="annotation-list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>人工标注灰度库 · 与主数据库并行</p>
    </footer>

    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/browser-common.js"></script>
    <script src="./assets/js/annotation.js?v=annotation-search-v5"></script>
  </body>
</html>
