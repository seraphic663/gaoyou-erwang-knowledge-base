<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人工标注库 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body data-page="annotation">
    <header class="subhero annotation-hero">
      <nav class="nav">
        <div class="brand">高邮二王考据过程知识库</div>
        <div class="nav-links">
          <a href="./index.html">返回首页</a>
          <a href="./annotation-workbench.html">标注工作台</a>
          <a href="./database.html?view=cases">主数据库</a>
          <a href="./ai-annotation.html">AI 释证</a>
          <a href="./knowledge.html">训诂知识</a>
        </div>
      </nav>

      <div class="hero-content">
        <p class="badge">实验性功能 · 人工标注库</p>
        <h1>人工标注库</h1>
        <div id="annotationHeroMeta" class="hero-panel"></div>
      </div>
    </header>

    <main class="section annotation-page">
      <p id="annotationStatus" class="db-status">正在读取人工标注库...</p>

      <div class="browser-layout">
        <aside class="browser-sidebar annotation-sidebar">
          <article class="card sidebar-card">
            <h3>来源文档</h3>
            <div id="annotationDocumentFilters" class="sidebar-filter-list"></div>
          </article>

          <article class="card sidebar-card">
            <h3>方法标签</h3>
            <div id="annotationMethodFilters" class="sidebar-filter-list"></div>
          </article>

          <article class="card sidebar-card browser-preset-card">
            <h3>预设搜索</h3>
            <div id="annotationPresets" class="browser-preset-list">
              <button class="preset-chip" type="button" data-annotation-query="平原之隰">平原之隰</button>
              <button class="preset-chip" type="button" data-annotation-query="误字">误字</button>
              <button class="preset-chip" type="button" data-annotation-query="集韻">集韻</button>
              <button class="preset-chip" type="button" data-annotation-query="发疑">发疑</button>
            </div>
          </article>
        </aside>

        <section class="browser-main">
          <section class="card browser-toolbar annotation-toolbar">
            <div class="head-line">
              <div>
                <p class="section-kicker">检索</p>
                <h2>人工标注库</h2>
              </div>
            </div>
            <div class="annotation-search-row">
            <label class="toolbar-field annotation-search-field">
                <input id="annotationSearchInput" type="text" placeholder="输入案例、方法、原文或标注关键词" />
            </label>

            <div class="toolbar-actions annotation-search-actions">
                <button id="annotationSearchButton" class="page-link toolbar-button" type="button">检索</button>
                <button id="annotationResetButton" class="search-clear toolbar-button" type="button">重置</button>
            </div>
            </div>
          </section>

          <div id="annotationSummary" class="search-summary"></div>
          <div id="annotationList" class="annotation-list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>人工标注灰度库 · 与主数据库并行</p>
    </footer>

    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/browser-common.js"></script>
    <script src="./assets/js/annotation.js?v=20260509-ai-json"></script>
  </body>
</html>
