<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据库 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="subhero">
      <nav class="nav" aria-label="主导航">
        <div class="brand">高邮二王知识库</div>
        <div class="nav-links">
          <a href="./index.html">专题首页</a>
          <div class="database-menu">
            <a class="database-trigger" href="./database.html?view=terms" aria-haspopup="true">数据库</a>
            <div class="database-panel" aria-label="选择数据库">
              <a href="./database.html?view=terms"><span>主数据库</span><small>词条、案例与证据</small></a>
              <a href="./annotation.html"><span>人工标注库</span><small>人工标注材料浏览</small></a>
              <a href="./v2-database.html#browse"><span>V2 工作库</span><small>案例、五步与质量</small></a>
            </div>
          </div>
          <a href="./ai-annotation.html">AI 释证</a>
          <a href="./annotation-workbench.html">五步释证</a>
          <a href="./knowledge.html">训诂知识</a>
        </div>
      </nav>

      <div class="hero-content">
        <p class="badge">数据库 · 浏览入口</p>
        <h1>数据库浏览</h1>
        <div id="browserHeroMeta" class="hero-panel"></div>
      </div>
    </header>

    <main>
      <section class="section">
        <p id="browserStatus" class="db-status">正在读取数据库...</p>

        <div class="browser-layout">
          <aside class="browser-sidebar">
            <article class="card sidebar-card">
              <h3>数据库类别</h3>
              <div id="browserNav" class="sidebar-nav"></div>
            </article>

            <article class="card sidebar-card">
              <h3>方法类别</h3>
              <div id="browserFilters" class="sidebar-filter-list"></div>
            </article>

            <article class="card sidebar-card">
              <h3>检索类别</h3>
              <div id="browserModeFilters" class="sidebar-filter-list"></div>
            </article>

            <article class="card sidebar-card browser-preset-card">
              <h3>常用预设</h3>
              <div id="browserPresets" class="fold-body browser-preset-list">
                <button class="preset-chip" type="button" data-preset-view="terms" data-preset-mode="entry" data-preset-query="周">查某个字词：周</button>
                <button class="preset-chip" type="button" data-preset-view="terms" data-preset-mode="fulltext" data-preset-query="通假">查某类术语：通假</button>
                <button class="preset-chip" type="button" data-preset-view="cases" data-preset-mode="fulltext" data-preset-query="古文">查案例片段：古文</button>
                <button class="preset-chip" type="button" data-preset-view="schema" data-preset-mode="entry" data-preset-query="">看数据库结构</button>
              </div>
            </article>

            <section id="browserSchemaSection" class="browser-panel">
              <details class="fold-card browser-schema-fold">
                <summary id="browserSchemaSummary">查看数据库</summary>
                <div class="fold-body">
                  <div id="browserSchemaGrid" class="grid grid-2"></div>
                </div>
              </details>
            </section>
          </aside>

          <section class="browser-main">
            <article class="card browser-toolbar">
              <div class="head-line">
                <div>
                  <p class="section-kicker">检索</p>
                  <h2 id="browserHeading">字词库</h2>
                </div>
              </div>

              <div class="browser-search-row">
                <label class="toolbar-field browser-search-field">
                  <input id="browserSearchInput" type="text" placeholder="输入词条、义项、正文关键词" />
                </label>

                <div class="toolbar-actions browser-search-actions">
                  <button id="browserSearchButton" class="page-link toolbar-button" type="button">检索</button>
                  <button id="browserResetButton" class="search-clear toolbar-button" type="button">重置</button>
                </div>
              </div>
            </article>

            <div id="browserSummary" class="search-summary"></div>

            <section id="browserListSection" class="browser-panel">
              <div id="browserList" class="grid grid-2"></div>
            </section>

            <div id="browserPagination" class="browser-pagination"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>数据库 · 字词、案例与证据关联</p>
    </footer>

    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/browser-common.js"></script>
    <script src="./assets/js/browser.js"></script>
  </body>
</html>
