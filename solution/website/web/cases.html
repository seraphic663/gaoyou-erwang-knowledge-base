<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      案例库 · 高邮二王知识库
    </title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/site.css">
  </head>
  <body>
    <header class="subhero">
      <!--site-navigation-->
      <div class="hero-content">
        <p class="badge">
          高邮二王 · 研究工作空间
        </p>
        <h1 id="detailTitle">
          案例库
        </h1>
        <p class="hero-copy">
          查找案例、阅读证据，并直接进入对应的释证与审校。不同来源的材料分别列出。
        </p>
      </div>
    </header>
    <main class="section">
      <a id="siteBack" class="site-back" href="/" hidden>返回来时位置</a>
      <form id="caseSearch" class="site-search">
        <label>
          关键词
          <input name="q" placeholder="标题、字词、方法或正文">
        </label>
        <label>
          来源
          <select name="source">
            <option value="all">全部来源</option>
          </select>
        </label>
        <button>
          检索案例
        </button>
        <details class="site-filters" id="caseAdvancedFilters">
          <summary>更多筛选：标注者、出处与状态</summary>
          <div class="site-filter-fields">
        <label data-filter-source="annotation">
          人工标注者
          <select name="annotator">
            <option value="all">
              全部标注者
            </option>
          </select>
        </label>
        <label data-filter-source="annotation">
          人工标注出处
          <select name="origin">
            <option value="all">
              全部出处
            </option>
          </select>
        </label>
        <label data-filter-source="v2">
          V2 来源
          <select name="source_work">
            <option value="">
              全部来源
            </option>
          </select>
        </label>
        <label data-filter-source="v2">
          机器状态
          <select name="machine_status">
            <option value="">
              全部状态
            </option>
            <option value="draft">
              机器草稿
            </option>
            <option value="schema_invalid">
              结构不合格
            </option>
          </select>
        </label>
          </div>
        </details>
      </form>
      <div class="site-actions">
        <a href="/quality">
          质量报告与数据库结构
        </a>
      </div>
      <p id="caseFilterStatus" role="status">
      </p>
      <div id="caseResults">
      </div>
    </main>
    <footer class="footer">
      高邮二王知识库 · 来源可追溯，审校记录保留
    </footer>
    <script src="/assets/js/utils.js">
    </script>
    <script src="/assets/js/page-catalog.js">
    </script>
    <script src="/assets/js/site.js">
    </script>
    <script src="/assets/js/case-sources.js">
    </script>
    <script src="/assets/js/cases.js">
    </script>
  </body>
</html>
