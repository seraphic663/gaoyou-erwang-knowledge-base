<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>典籍检索 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/corpus.css" />
  <link rel="stylesheet" href="/assets/css/site.css"></head>
  <body data-corpus-view="search">
    <header class="subhero corpus-hero">
      <!--site-navigation-->

      <div class="hero-content">
        <p class="badge">Corpus · 原典与外典统一检索</p>
        <h1>典籍检索</h1>
        <p class="hero-copy">检索二王原典与外典，查看命中原文和出处。</p>
      </div>
    </header>

    <main class="section corpus-page"><a id="siteBack" class="site-back" href="/" hidden>返回来时位置</a>
      <p id="corpusStatus" class="db-status">正在连接典籍检索……</p>

      <section class="card corpus-panel">
        <div class="corpus-panel-heading">
          <div>

            <h2>统一检索</h2>
          </div>
          <span id="corpusResultCount" class="summary-pill">尚未检索</span>
        </div>

        <section class="corpus-search" aria-label="典籍检索">
          <form id="corpusSearchForm" class="corpus-search-form">
            <label class="corpus-query-field">
              <span>检索词或正文片段</span>
              <textarea id="corpusQuery" rows="4" placeholder="多个词用空格分开，按下方关系组合，如：農 毋"></textarea>
            </label>
            <fieldset class="corpus-filter-group corpus-mode-group">
              <legend>检索模式</legend>
              <label><input type="radio" name="corpusMode" value="unified" checked /> 统一（正文 + 书名）</label>
              <label><input type="radio" name="corpusMode" value="body" /> 仅正文</label>
              <label><input type="radio" name="corpusMode" value="title" /> 仅书名</label>
            </fieldset>
            <fieldset class="corpus-filter-group corpus-mode-group">
              <legend>多词关系</legend>
              <label><input type="radio" name="corpusQueryMatch" value="all" checked /> 全部命中（AND）</label>
              <label><input type="radio" name="corpusQueryMatch" value="any" /> 任一命中（OR）</label>
            </fieldset>
            <fieldset class="corpus-filter-group corpus-mode-group">
              <legend>检索长度</legend>
              <label><input id="corpusAllowSingleCharacter" type="checkbox" /> 允许单字词检索</label>
              <p class="compact-note">默认双字及以上；单字词组合只查二王原典。</p>
            </fieldset>
            <fieldset class="corpus-filter-group corpus-scope-group">
              <legend>典籍范围（可多选）</legend>
              <div class="corpus-scope-row" id="corpusOriginalRow">
                <label class="corpus-scope-heading"><input id="corpusOriginalEnabled" type="checkbox" checked /> 二王原典</label>
                <div class="corpus-scope-options" id="corpusOriginalWorks">
                  <label><input type="checkbox" name="corpusWork" value="dushu_zazhi" checked /> 读书杂志</label>
                  <label><input type="checkbox" name="corpusWork" value="guangya_shuzheng" checked /> 广雅疏证</label>
                  <label><input type="checkbox" name="corpusWork" value="jingyi_shuwen" checked /> 经义述闻</label>
                  <label><input type="checkbox" name="corpusWork" value="jingzhuan_shici" checked /> 经传释词</label>
                </div>
              </div>
              <div class="corpus-scope-row" id="corpusExternalRow">
                <label class="corpus-scope-heading"><input id="corpusExternalEnabled" type="checkbox" checked /> 外部典籍</label>
                <div class="corpus-scope-options">
                  <label><input type="checkbox" name="corpusCollection" value="external_high" checked /> 高频</label>
                  <label><input type="checkbox" name="corpusCollection" value="external_mid" checked /> 中频</label>
                  <label><input type="checkbox" name="corpusCollection" value="external_low" checked /> 低频</label>
                </div>
              </div>
            </fieldset>
          </form>
          <p id="corpusSearchStatus" class="compact-note" aria-live="polite"></p>
          <div id="corpusResults" class="corpus-results" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <p>典籍检索 · 查看原文出处与邻接文段</p>
    </footer>

    <script src="/assets/js/utils.js"></script><script src="/assets/js/page-catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/corpus-browser.js"></script>
  </body>
</html>
