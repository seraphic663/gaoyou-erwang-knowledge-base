<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原典检索 · 高邮二王考据过程知识库</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/corpus.css" />
  <link rel="stylesheet" href="/assets/css/site.css"></head>
  <body data-corpus-view="search">
    <header class="subhero corpus-hero">
      <!--site-navigation-->

      <div class="hero-content">
        <p class="badge">Corpus · 只读正文检索</p>
        <h1>原典检索</h1>
        <p class="hero-copy">检索已经登记的原典正文，查看出处、定位信息和关联案例。可从命中原文直接查看关联案例或进入审校。</p>
      </div>
    </header>

    <main class="section corpus-page"><a id="siteBack" class="site-back" href="/" hidden>返回来时位置</a>
      <p id="corpusStatus" class="db-status">正在连接原典检索……</p>

      <section class="card corpus-panel">
        <div class="corpus-panel-heading">
          <div>

            <h2>检索正文</h2>
          </div>
          <span id="corpusResultCount" class="summary-pill">尚未检索</span>
        </div>

        <section class="corpus-search" aria-label="正文片段检索">
          <form id="corpusSearchForm" class="corpus-search-form">
            <label class="corpus-query-field">
              <span>正文片段</span>
              <textarea id="corpusQuery" rows="4" placeholder="例如：平原之隰，奚有於高"></textarea>
            </label>
            <label class="toolbar-field">
              <span>作品范围</span>
              <select id="corpusWork"><option value="all">四部著作</option></select>
            </label>
            <div class="corpus-search-actions">
              <button id="corpusSearchButton" class="page-link toolbar-button" type="submit">检索正文</button>
              <button id="corpusReset" class="search-clear toolbar-button" type="button">清空</button>
            </div>
          </form>
          <p id="corpusSearchStatus" class="compact-note" aria-live="polite">输入一段正文后检索。</p>
          <div id="corpusResults" class="corpus-results" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <p>原典检索 · 查看原文出处，追溯关联案例</p>
    </footer>

    <script src="/assets/js/utils.js"></script><script src="/assets/js/page-catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/corpus-browser.js"></script>
  </body>
</html>
